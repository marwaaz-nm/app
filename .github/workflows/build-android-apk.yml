name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'capacitor-web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/marwaaz-release.jks

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: marwaaz-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK package and signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "Verified using v1 scheme (JAR signing): true" apk-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt
          grep -q "package: name='com.marwaazpn.app' versionCode='3' versionName='1.1.1'" apk-badging.txt
          grep -q "sdkVersion:'24'" apk-badging.txt

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Marwaazpn-App.apk

      - name: Publish APK to the web download folder
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/downloads
          cp Marwaazpn-App.apk public/downloads/Marwaazpn-App.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/Marwaazpn-App.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Android APK v1.1.1 [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Marwaazpn-App-Android-v1.1.1
          path: |
            Marwaazpn-App.apk
            apk-badging.txt
            apk-signature.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.1.1
          name: Marwaazpn App Android v1.1.1
          body: |
            Compatibility-signed Android release APK for Marwaazpn App.
            Supports Android 7.0 and newer.
            If an older debug-signed version is installed, uninstall it once before installing this release.
          files: Marwaazpn-App.apk
          make_latest: true